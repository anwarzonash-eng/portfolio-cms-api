name: Production

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, personal_backend]

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node Modules in personal_websites_backend
        run: npm install
      
      - run: rm package-lock.json
      
      - run: cp .env.production .env

      - name: Build Project
        run: npm run build

      - name: Start Application with PM2
        run: pm2 start personal_backend


